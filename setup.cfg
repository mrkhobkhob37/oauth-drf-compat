[metadata]
name = oauth-drf-compat
# Fork note: the upstream version (attr: oauth2_provider.__version__) is
# frozen explicitly below so tags, checkouts, and sdist builds can never
# silently disagree about the fork version.  See FORK_VERSION in
# oauth2_provider/__init__.py.
version = 2.3.0+epic.1
description = OAuth2 Provider for Django
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Federico Frenguelli, Massimiliano Pippi
author_email = synasius@gmail.com
url = https://github.com/jazzband/django-oauth-toolkit
keywords = django, oauth, oauth2, oauthlib
classifiers =
	Development Status :: 5 - Production/Stable
	Environment :: Web Environment
	Framework :: Django
	Framework :: Django :: 2.2
	Framework :: Django :: 3.2
	Framework :: Django :: 4.0
	Framework :: Django :: 4.1
	Framework :: Django :: 4.2
	Intended Audience :: Developers
	Operating System :: OS Independent
	Programming Language :: Python :: 3
	Programming Language :: Python :: 3.7
	Programming Language :: Python :: 3.8
	Programming Language :: Python :: 3.9
	Programming Language :: Python :: 3.10
	Programming Language :: Python :: 3.11
	Topic :: Internet :: WWW/HTTP

[options]
packages = find:
include_package_data = True
zip_safe = False
# jwcrypto has a direct dependency on six, but does not list it yet in a release
# Previously, cryptography also depended on six, so this was unnoticed
install_requires =
	django >= 2.2, != 4.0.0
	requests >= 2.13.0
	oauthlib >= 3.1.0
	jwcrypto >= 0.8.0

[options.packages.find]
exclude =
	tests
	tests.*
